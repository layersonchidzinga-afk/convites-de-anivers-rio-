/* ================================
   ESTADO DOS CONVIDADOS
================================ */

let estados = {};


/* ================================
   MOSTRAR TABELA
================================ */

function mostrarTabela(lista = convidados) {

    const tabela =
        document.getElementById("listaConvidados");

    tabela.innerHTML = "";

    lista.forEach((convite) => {

        const estado =
            estados[convite.numero] || {};

        const confirmado =
            estado.confirmado === true;

        const entrou =
            estado.entrou === true;


        const linha =
            document.createElement("tr");


        linha.innerHTML = `

            <td>
                <strong>${convite.numero}</strong>
            </td>

            <td class="nome">
                ${convite.nome}
            </td>

            <td>
                ${convite.pessoas}
            </td>

            <td class="pin">
                ${convite.pin}
            </td>

            <td>

                ${
                    confirmado

                    ?

                    '<span class="badge confirmado">CONFIRMADO</span>'

                    :

                    '<span class="badge nao-confirmado">NÃO CONFIRMADO</span>'
                }

            </td>

            <td>

                ${
                    entrou

                    ?

                    '<span class="badge entrou">ENTROU</span>'

                    :

                    '<span class="badge nao-entrou">NÃO ENTROU</span>'
                }

            </td>

            <td>

                ${
                    !entrou

                    ?

                    `<button
                        class="btn-entrada"
                        onclick="marcarEntrada('${convite.numero}')">
                        ✓ MARCAR ENTRADA
                    </button>`

                    :

                    `<button
                        class="btn-desfazer"
                        onclick="desfazerEntrada('${convite.numero}')">
                        DESFAZER
                    </button>`
                }

            </td>

        `;


        tabela.appendChild(linha);

    });


    atualizarResumo();

}


/* ================================
   MARCAR ENTRADA
================================ */

window.marcarEntrada = async function(numero) {

    const convite =
        convidados.find(c => c.numero === numero);

    if (!convite) return;


    const confirmar =
        confirm(
            "Confirmar entrada de " +
            convite.nome +
            "?"
        );

    if (!confirmar) return;


    try {

        await update(
            ref(db, "convites/" + numero),
            {
                entrou: true,
                dataEntrada:
                    new Date().toLocaleString("pt-PT")
            }
        );

    } catch (erro) {

        console.error(erro);

        alert(
            "Não foi possível registrar a entrada."
        );

    }

};


/* ================================
   DESFAZER ENTRADA
================================ */

window.desfazerEntrada = async function(numero) {

    const confirmar =
        confirm(
            "Deseja realmente retirar a marcação de entrada?"
        );

    if (!confirmar) return;


    try {

        await update(
            ref(db, "convites/" + numero),
            {
                entrou: false
            }
        );

    } catch (erro) {

        console.error(erro);

        alert(
            "Não foi possível alterar o estado."
        );

    }

};


/* ================================
   PESQUISA
================================ */

window.pesquisar = function() {

    const texto =
        document
        .getElementById("pesquisa")
        .value
        .toLowerCase()
        .trim();


    if (!texto) {

        mostrarTabela(convidados);

        return;
    }


    const resultado =
        convidados.filter((convite) => {

            return (

                convite.nome
                .toLowerCase()
                .includes(texto)

                ||

                convite.pin
                .toLowerCase()
                .includes(texto)

                ||

                convite.numero
                .includes(texto)

            );

        });


    mostrarTabela(resultado);

};


/* ================================
   RESUMO
================================ */

function atualizarResumo() {

    let totalEntraram = 0;


    convidados.forEach((convite) => {

        if (
            estados[convite.numero] &&
            estados[convite.numero].entrou === true
        ) {

            totalEntraram += convite.pessoas;

        }

    });


    document
        .getElementById("totalEntraram")
        .textContent = totalEntraram;

}


/* ================================
   LER FIREBASE
================================ */

const convitesRef =
    ref(db, "convites");


onValue(convitesRef, (snapshot) => {

    const dados =
        snapshot.val() || {};


    estados = dados;


    mostrarTabela();

});


/* ================================
   MOSTRAR INICIALMENTE
================================ */

mostrarTabela();
