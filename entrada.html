<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Entrada | Layerson & Naira</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #604b16 0%, #211906 28%, #060606 70%, #000 100%);
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: auto;
}

.card {
    background: rgba(8,8,8,.97);
    border: 1px solid #d4af37;
    border-radius: 25px;
    padding: 30px 20px;
    margin-bottom: 20px;
    box-shadow: 0 0 60px rgba(212,175,55,.15);
}

h1 {
    text-align: center;
    color: #e5c65a;
    font-size: 30px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    line-height: 1.7;
    margin-bottom: 25px;
}

#reader {
    width: 100%;
    max-width: 500px;
    margin: auto;
    border-radius: 20px;
    overflow: hidden;
}

#reader video {
    border-radius: 15px !important;
}

button {
    width: 100%;
    padding: 17px;
    margin-top: 15px;
    border: 0;
    border-radius: 40px;
    background: linear-gradient(
        135deg,
        #a77a18,
        #f0d66b,
        #a77a18
    );
    color: #080808;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.result {
    margin-top: 25px;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
}

.valid {
    background: rgba(40,150,70,.15);
    border: 1px solid #4bea7d;
}

.invalid {
    background: rgba(170,30,30,.15);
    border: 1px solid #ff5555;
}

.result-number {
    font-size: 60px;
    color: #e5c65a;
    margin-bottom: 10px;
}

.result-name {
    font-size: 28px;
    margin-bottom: 18px;
}

.status {
    font-size: 18px;
    line-height: 1.7;
}

.hidden {
    display: none;
}

.lista {
    margin-top: 20px;
}

.pessoa {
    padding: 18px 5px;
    border-bottom: 1px solid rgba(212,175,55,.2);
}

.pessoa strong {
    color: #e5c65a;
}

.pessoa span {
    display: block;
    margin-top: 7px;
}

.entrou {
    color: #55ed82;
}

.confirmado {
    color: #ffca58;
}

.pendente {
    color: #888;
}

.info {
    text-align: center;
    color: #aaa;
    line-height: 1.6;
    margin: 15px 0;
}

.erro {
    color: #ff7777;
    text-align: center;
    margin-top: 15px;
}

.sucesso {
    color: #55ed82;
}

@media(max-width:500px) {

    .card {
        padding: 22px 15px;
    }

    h1 {
        font-size: 25px;
    }

    .result-number {
        font-size: 50px;
    }

    .result-name {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- =====================================
     CONTROLE DE ENTRADA
===================================== -->

<div class="card">

<h1>🎟️ CONTROLE DE ENTRADA</h1>

<div class="subtitle">

<strong>LAYESON &amp; NAIRA</strong>

<br>

19 de setembro de 2026

<br>

18h00 — Salão Rosita

</div>


<div class="info">

Aponte a câmera para o QR Code
do convite do convidado.

</div>


<!-- LEITOR QR -->

<div id="reader"></div>


<div id="mensagemCamera" class="info">

Clique em <strong>INICIAR LEITOR</strong>
para abrir a câmera.

</div>


<button
id="btnIniciar"
onclick="iniciarLeitor()">

📷 INICIAR LEITOR QR

</button>


<button
id="btnParar"
onclick="pararLeitor()"
style="display:none;">

⛔ PARAR LEITOR

</button>


<!-- RESULTADO -->

<div
id="resultado"
style="display:none;">
</div>


</div>


<!-- =====================================
     LISTA DE CONVIDADOS
===================================== -->

<div class="card">

<h1>📋 CONVIDADOS</h1>

<div id="lista">

A carregar convidados...

</div>

</div>


</div>


<!-- =====================================
     BIBLIOTECA QR CODE
===================================== -->

<script src="https://unpkg.com/html5-qrcode"
crossorigin="anonymous"></script>


<!-- =====================================
     FIREBASE
===================================== -->

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getDatabase,
    ref,
    get,
    update
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =====================================
   CONFIGURAÇÃO FIREBASE
===================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBWrcrW1MiiklxpzOgQN7yCVsOJ2MWnhGM",

    authDomain:
    "convite-layerson-naira.firebaseapp.com",

    databaseURL:
    "https://convite-layerson-naira-default-rtdb.firebaseio.com",

    projectId:
    "convite-layerson-naira",

    storageBucket:
    "convite-layerson-naira.firebasestorage.app",

    messagingSenderId:
    "680240896134",

    appId:
    "1:680240896134:web:2d2aa2f97fb491e2001907"

};


const app =
initializeApp(firebaseConfig);


const db =
getDatabase(app);


/* =====================================
   VARIÁVEL DO LEITOR
===================================== */

let scanner = null;

let leitorAtivo = false;


/* =====================================
   INICIAR LEITOR
===================================== */

window.iniciarLeitor = async function() {

    const mensagem =
    document.getElementById("mensagemCamera");

    try {

        if (leitorAtivo) {
            return;
        }


        scanner =
        new Html5Qrcode("reader");


        const cameras =
        await Html5Qrcode.getCameras();


        if (!cameras || cameras.length === 0) {

            mensagem.innerHTML =
            "❌ Nenhuma câmera foi encontrada neste dispositivo.";

            mensagem.className =
            "erro";

            return;
        }


        let cameraId =
        cameras[0].id;


        /* Preferir câmera traseira */

        const traseira =
        cameras.find(camera =>
            /back|rear|traseira|environment/i
            .test(camera.label)
        );


        if (traseira) {
            cameraId = traseira.id;
        }


        leitorAtivo = true;


        document
        .getElementById("btnIniciar")
        .style.display = "none";


        document
        .getElementById("btnParar")
        .style.display = "block";


        mensagem.innerHTML =
        "📷 Aponte a câmera para o QR Code.";


        mensagem.className =
        "info";


        await scanner.start(

            cameraId,

            {

                fps: 10,

                qrbox: {
                    width: 250,
                    height: 250
                },

                aspectRatio: 1.0

            },

            function(decodedText) {

                processarQR(decodedText);

            },

            function(errorMessage) {

                /* Erros normais durante a procura
                   do QR Code são ignorados. */

            }

        );

    }

    catch(error) {

        console.error(error);

        leitorAtivo = false;


        document
        .getElementById("btnIniciar")
        .style.display = "block";


        document
        .getElementById("btnParar")
        .style.display = "none";


        mensagem.innerHTML =
        "❌ Não foi possível abrir a câmera.<br><br>" +
        "Verifique se autorizou o acesso à câmera.";

        mensagem.className =
        "erro";

    }

};


/* =====================================
   PARAR LEITOR
===================================== */

window.pararLeitor = async function() {

    try {

        if (scanner && leitorAtivo) {

            await scanner.stop();

            await scanner.clear();

        }

    }

    catch(error) {

        console.log(error);

    }


    leitorAtivo = false;


    document
    .getElementById("btnIniciar")
    .style.display = "block";


    document
    .getElementById("btnParar")
    .style.display = "none";


    document
    .getElementById("mensagemCamera")
    .innerHTML =
    "Clique em <strong>INICIAR LEITOR</strong> para abrir a câmera.";

};


/* =====================================
   PROCESSAR QR
===================================== */

async function processarQR(texto) {

    /* Para evitar várias leituras
       do mesmo QR */

    await pararLeitor();


    try {

        const dados =
        JSON.parse(texto);


        if (
            !dados.convite ||
            !dados.nome
        ) {

            mostrarResultado(

                false,

                "",

                "",

                "Este QR Code não pertence ao sistema de convites."

            );

            return;
        }


        await verificarConvite(

            dados.convite,

            dados.nome

        );

    }

    catch(error) {

        console.error(error);


        mostrarResultado(

            false,

            "",

            "",

            "❌ QR Code inválido."

        );

    }

}


/* =====================================
   VERIFICAR CONVITE
===================================== */

async function verificarConvite(

    numero,

    nome

) {

    try {

        const caminho =
        "convites/" + numero;


        const snapshot =
        await get(
            ref(db, caminho)
        );


        if (!snapshot.exists()) {

            mostrarResultado(

                false,

                numero,

                nome,

                "Este convite ainda não foi confirmado."

            );

            return;
        }


        const dados =
        snapshot.val();


        if (dados.entrou === true) {

            mostrarResultado(

                false,

                numero,

                dados.nome || nome,

                "⚠️ ESTE CONVITE JÁ FOI UTILIZADO."

            );

            return;
        }


        mostrarResultado(

            true,

            numero,

            dados.nome || nome,

            "CONVITE VÁLIDO — ENTRADA AUTORIZADA."

        );

    }

    catch(error) {

        console.error(error);


        mostrarResultado(

            false,

            numero,

            nome,

            "Erro ao consultar o convite."

        );

    }

}


/* =====================================
   MOSTRAR RESULTADO
===================================== */

function mostrarResultado(

    valido,

    numero,

    nome,

    mensagem

) {

    const resultado =
    document.getElementById("resultado");


    resultado.style.display =
    "block";


    resultado.className =
    valido
    ? "result valid"
    : "result invalid";


    resultado.innerHTML = `

        ${
            numero
            ?
            `<div class="result-number">
                ${numero}
            </div>`
            :
            ""
        }


        ${
            nome
            ?
            `<div class="result-name">
                ${nome}
            </div>`
            :
            ""
        }


        <div class="status">

            ${valido ? "🟢" : "🔴"}

            <br><br>

            ${mensagem}

        </div>


        ${
            valido

            ?

            `<button
                onclick="marcarEntrada('${numero}')">

                ✅ MARCAR COMO ENTROU

            </button>`

            :

            ""

        }

    `;

}


/* =====================================
   REGISTRAR ENTRADA
===================================== */

window.marcarEntrada =
async function(numero) {

    try {

        const caminho =
        "convites/" + numero;


        const agora =
        new Date();


        await update(

            ref(db, caminho),

            {

                entrou: true,

                horaEntrada:
                agora.toLocaleTimeString("pt-PT"),

                dataEntrada:
                agora.toLocaleDateString("pt-PT")

            }

        );


        const resultado =
        document.getElementById("resultado");


        resultado.className =
        "result valid";


        resultado.innerHTML = `

            <div class="result-number">
                ${numero}
            </div>


            <div class="result-name">

                ENTRADA REGISTRADA

            </div>


            <div class="status">

                🟢

                <br><br>

                CONVITE AUTORIZADO

                <br><br>

                ✅ A PESSOA PODE ENTRAR

            </div>

        `;


        carregarLista();

    }

    catch(error) {

        console.error(error);


        mostrarResultado(

            false,

            numero,

            "",

            "Erro ao registrar a entrada."

        );

    }

};


/* =====================================
   LISTA DE CONVIDADOS
===================================== */

async function carregarLista() {

    const lista =
    document.getElementById("lista");


    lista.innerHTML = "";


    const convidados = [

        {
            numero: "01",
            nome: "ALLEN DA GRAÇA"
        },

        {
            numero: "02",
            nome: "ERIK"
        },

        {
            numero: "03",
            nome: "ZOZÓ"
        },

        {
            numero: "04",
            nome: "LENIA"
        },

        {
            numero: "05",
            nome: "ELTON"
        }

    ];


    for (
        const pessoa of convidados
    ) {

        try {

            const snapshot =
            await get(

                ref(

                    db,

                    "convites/" +
                    pessoa.numero

                )

            );


            const div =
            document.createElement("div");


            div.className =
            "pessoa";


            if (snapshot.exists()) {

                const dados =
                snapshot.val();


                if (dados.entrou === true) {

                    div.innerHTML = `

                        <strong>

                            CONVITE
                            ${pessoa.numero}
                            —
                            ${dados.nome || pessoa.nome}

                        </strong>

                        <span class="entrou">

                            🟢 JÁ ENTROU

                        </span>

                    `;

                }

                else if (
                    dados.confirmado === true
                ) {

                    div.innerHTML = `

                        <strong>

                            CONVITE
                            ${pessoa.numero}
                            —
                            ${dados.nome || pessoa.nome}

                        </strong>

                        <span class="confirmado">

                            🟡 CONFIRMADO —
                            AINDA NÃO ENTROU

                        </span>

                    `;

                }

                else {

                    div.innerHTML = `

                        <strong>

                            CONVITE
                            ${pessoa.numero}
                            —
                            ${dados.nome || pessoa.nome}

                        </strong>

                        <span class="pendente">

                            ⚪ AINDA NÃO CONFIRMADO

                        </span>

                    `;

                }

            }

            else {

                div.innerHTML = `

                    <strong>

                        CONVITE
                        ${pessoa.numero}
                        —
                        ${pessoa.nome}

                    </strong>

                    <span class="pendente">

                        ⚪ AINDA NÃO CONFIRMADO

                    </span>

                `;

            }


            lista.appendChild(div);

        }

        catch(error) {

            console.error(error);

        }

    }

}


carregarLista();


setInterval(

    carregarLista,

    5000

);

</script>

</body>
</html>
